<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#070707" />
  <meta name="description" content="Continental Fight League — Upcoming 2027. Boxing and MMA from the Dominican Republic." />
  <title>Upcoming 2027 | CFL</title>
  <link rel="icon" href="assets/favicon.png?v=5" type="image/png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=5" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=10" />
  <script>
    document.documentElement.lang = localStorage.getItem("cfl-lang") || "en";
  </script>
</head>
<body class="page-landing">
  <a class="skip-link" href="#main" data-i18n="skip">Saltar al contenido</a>

  <div class="landing-shade" aria-hidden="true"></div>

  <header class="landing-top">
    <a class="landing-brand" href="/" data-i18n-aria="brand_home" aria-label="CFL, inicio">
      <img src="assets/cfl-logo-white.png?v=6" alt="Continental Fight League" />
    </a>
    <div class="landing-tools">
      <div class="lang-switch" role="group" data-i18n-aria="lang_label" aria-label="Idioma">
        <button type="button" data-lang="es" aria-pressed="false">ES</button>
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
      </div>
      <a class="landing-ig" href="https://www.instagram.com/cfldr" target="_blank" rel="noopener noreferrer">Instagram</a>
    </div>
  </header>

  <main class="landing-main" id="main">
    <p class="eyebrow" data-i18n="landing_label">Continental Fight League</p>
    <h1>
      <span data-i18n="landing_title">Próximamente</span>
      <span class="landing-year" data-i18n="landing_year">2027</span>
    </h1>
    <p class="landing-copy" data-i18n="landing_copy">Cartelera, atletas y boletos se anuncian en 2027.</p>
    <form class="signup-form landing-form" action="#" method="post">
      <label>
        <span class="sr-only" data-i18n="email">Correo electrónico</span>
        <input type="email" name="email" data-i18n-placeholder="email" placeholder="Correo electrónico" autocomplete="email" required />
      </label>
      <button type="submit" data-i18n="landing_submit">Avísame</button>
    </form>
  </main>

  <footer class="landing-foot">
    <a href="mailto:info@continentalfightleague.com">info@continentalfightleague.com</a>
    <span>© 2026 Continental Fight League</span>
  </footer>

  <script src="i18n.js?v=5"></script>
  <script src="script.js"></script>
</body>
</html>
